# BiguaSim scenario for the standalone collection: world, vehicle
# (BlueROV2), sensors and spawn. Parsed by
# biguasim_dataset_standalone/config/simulator_cfg.py.
#
# Sockets/frame_ids (imu_link, dvl_link, sonar_link, pressure_link) match the
# ROS 2 sensor catalog, so the rosbag conversion in ../colecta_biguasim can
# rebuild the same TF tree / topics. See ../colecta_biguasim/docs/sensors.md
# for details on each sensor.
package_name: SkyDive
world: Pier-Harbor
main_agent: rov0
ticks_per_sec: 30
# NOTE: 'frames_per_sec' is omitted on purpose. The standalone loop calls
# env.step() once per simulation tick, with no wall-clock timer, and
# biguasim falls back to ticks_per_sec when the key is missing.

agents:
  - agent_name: rov0
    agent_type: BlueROV2

    sensors:
      # --- Ground truth (engine, global frame, at the vehicle's COM) ---
      - sensor_type: DynamicsSensor
        sensor_name: DynamicsSensor
        socket: base_link
        configuration:
          UseCOM: true
          UseRPY: false

      # --- IMU ---
      - sensor_type: IMUSensor
        sensor_name: IMUSensor
        socket: imu_link
        configuration:
          AccelSigma: 0.05
          AngVelSigma: 0.01
          ReturnBias: false

      # --- DVL ---
      - sensor_type: DVLSensor
        sensor_name: DVLSensor
        socket: dvl_link
        location: [0.0, 0.0, -0.1]
        Hz: 5
        configuration:
          Elevation: 22.5
          VelSigma: 0.01
          ReturnRange: true
          MaxRange: 50
          RangeSigma: 0.05

      # --- Depth / pressure ---
      - sensor_type: DepthSensor
        sensor_name: DepthSensor
        socket: pressure_link
        location: [0.0, 0.0, 0.05]
        configuration:
          Sigma: 0.02

      # --- Magnetometer (compass) ---
      - sensor_type: MagnetometerSensor
        sensor_name: MagnetometerSensor
        socket: base_link
        configuration:
          Sigma: 0.01

      # --- Imaging sonar ---
      - sensor_type: ImagingSonar
        sensor_name: ImagingSonar
        socket: sonar_link
        location: [0.3, 0.0, 0.0]
        Hz: 5
        configuration:
          RangeBins: 394
          AzimuthBins: 768
          RangeMin: 0.5
          RangeMax: 10.0
          Azimuth: 130
          Elevation: 20
          InitOctreeRange: 20
          MultiPath: true
          AddSigma: 0.05
          MultSigma: 0.05
          RangeSigma: 0.05
          ScaleNoise: true
          ViewRegion: false
          ViewOctree: -1
          ShowWarning: false
          # The sonar's own ground-truth channels (clean, without the
          # 'raw' noise model) -- kept because they are useful for research.
          SendGTIntensity: true
          SendGTElevation: true
          SendGTPointCloud: true

      # --- RGB camera ---
      - sensor_type: RGBCamera
        sensor_name: RGBCamera
        socket: camera_link
        Hz: 10
        configuration:
          CaptureWidth: 256
          CaptureHeight: 256

      # --- Semantic segmentation ---
      - sensor_type: AnnotationComponent
        sensor_name: AnnotationComponent
        socket: camera_link
        Hz: 10
        configuration:
          CaptureWidth: 256
          CaptureHeight: 256

      # Sensors available in the engine but DISABLED here:
      #   - DepthCamera: same socket as RGBCamera, disabled to keep the
      #     dataset light.
      #   - RangeFinderSensor (altimeter): not part of the minimal set.
      #   - AcousticBeaconSensor: ACTIVE sensor (only answers an explicit
      #     ping), meaningless without a second agent/beacon.
      #   - GPSSensor: only applies to a surface agent; this scenario has a
      #     single underwater agent.

    dynamics:
      batch_size: 1

    # cmd_pos_yaw = [x, y, z, yaw_deg], absolute target position -- what
    # trajectories.py/planner.py produce.
    control_abstraction: cmd_pos_yaw

    location: [59.0, -245.0, -1.0]   # spawn, right next to the first point of waypoints/example.csv
    rotation: [0.0, 0.0, 0.0]
