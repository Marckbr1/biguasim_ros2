# Escenario de un solo agente para las trayectorias cuadrado/circulo.
#
# Difiere de biguasim_main/config/config.yaml en dos cosas: un solo agente
# 'auv0' (en vez de auv0 sin sonar + auv1 con sonar), y
# control_abstraction: 'cmd_pos_yaw' (en vez de 'cmd_motor_speeds') -- es la
# abstraccion que trajectory_generator_node sabe comandar
# ([x, y, z, yaw_deg] absolutos, ver COMMAND_MAP en biguasim_main/interface.py).
# El agente lleva DynamicsSensor (odometria/ground truth, la usan
# trajectory_generator y biguasim_bridge/odom_bridge_node) e ImagingSonar
# (para la variante "trayectoria + sonar"; si solo se quiere mover el
# vehiculo el sensor simplemente no se visualiza -- no hace falta otro
# escenario).
/**:
  ros__parameters:
    biguasim_scenario:
      package_name: SkyDive
      world: Pier-Harbor
      main_agent: auv0
      ticks_per_sec: 30
      frames_per_sec: 180
      octree_min: 0.1
      octree_max: 5
      draw_arrow: true
      show_viewport: true
      agents:
        - agent_name: auv0
          agent_type: BlueROV2
          publish_commands: false
          sensors:
            - sensor_type: DynamicsSensor
              ros_publish: true
              configuration:
                UseCOM: true
                UseRPY: false
            - sensor_type: IMUSensor
              ros_publish: true
            - sensor_type: DVLSensor
              ros_publish: true
            - sensor_type: ImagingSonar
              ros_publish: true
              configuration:
                RangeBins: 64
                AzimuthBins: 64
                RangeMin: 0
                RangeMax: 40
                InitOctreeRange: 20
                Elevation: 28
                Azimuth: 28.8
                AzimuthStreaks: -1
                ScaleNoise: true
                AddSigma: 0.15
                MultSigma: 0.2
                RangeSigma: 0.0
                MultiPath: true
                ViewRegion: true
                ViewOctree: -1
                SendGTPointCloud: true
            - sensor_type: RGBCamera
              ros_publish: true
              configuration:
                CaptureWidth: 640
                CaptureHeight: 480
        # sensors:
        #    - sensor_type: DynamicsSensor
        #      ros_publish: true
        #      configuration:
        #        UseCOM: true
        #        UseRPY: false
          #  -  sensor_type: ImagingSonar
          #     ros_publish: true
          #     configuration:
          #      RangeBins: 64
          #      AzimuthBins: 64
          #      RangeMin: 0
          #      RangeMax: 40
          #      InitOctreeRange: 20
          #      Elevation: 28
          #      Azimuth: 28.8
          #      AzimuthStreaks: -1
          #      ScaleNoise: true
          #      AddSigma: 0.15
          #      MultSigma: 0.2
          #      RangeSigma: 0.0
          #      MultiPath: true
          #      ViewRegion: true
          #      ViewOctree: -1
          #      SendGTPointCloud: true
          dynamics:
            batch_size: 1
          control_abstraction: 'cmd_pos_yaw'
          location: [10, -301, -1]
          rotation: [0, 0, 0]
