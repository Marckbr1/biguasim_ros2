ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # 1. Entrada DVL: Velocidade linear no frame do corpo
    twist0: /biguasim/auv0_id0/DVLSensor/Velocity
    twist0_config: [false, false, false,   # x, y, z (posicao nao medida pelo DVL)
                    false, false, false,   # roll, pitch, yaw
                    true,  true,  true,    # vx, vy, vz (velocidades medidas)
                    false, false, false,   # v_roll, v_pitch, v_yaw
                    false, false, false]   # aceleracoes
    twist0_queue_size: 10

    # 2. Entrada IMU: Orientacao angular e velocidades de rotacao
    imu0: /biguasim/auv0_id0/IMUSensor
    imu0_config: [false, false, false,
                  true,  true,  true,    # roll, pitch, yaw (atitude)
                  false, false, false,
                  true,  true,  true,    # angular velocities
                  false, false, false]   # aceleracao linear (opcional: true se confiavel)
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
