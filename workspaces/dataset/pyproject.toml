[project]
name = "biguasim-dataset-standalone"
version = "0.1.0"
description = "Minimal standalone (no ROS 2) waypoint data collection for BiguaSim, with a georeferenced map."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "matplotlib>=3.8",
]

# 'biguasim' itself is NOT declared here: it is not a PyPI package. Install
# it separately in editable mode (`pip install -e ~/biguasim`), see
# ../../BIGUASIM.md.

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["biguasim_dataset_standalone*"]
